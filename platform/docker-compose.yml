# Platform layer: the shared pieces every tenant uses.
#
#   caddy          — the only thing on :80/:443. Terminates TLS, routes by subdomain.
#   mongo          — ONE mongod, one database per tenant. Never publishes a port.
#   control-plane  — provisioning UI at CP_HOST, behind Caddy basic auth plus
#                    its own login. Also on 127.0.0.1:9000 for SSH tunnels. It
#                    holds the Docker socket (root on the box) — keep both gates.
#
# Tenant stacks live in their own compose projects and join semivra-net.
# Start this first:  docker compose -f platform/docker-compose.yml up -d
name: semivra-platform

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
      CP_HOST: ${CP_HOST:?set CP_HOST in platform/.env}
      CP_BASIC_USER: ${CP_BASIC_USER:?set CP_BASIC_USER in platform/.env}
      CP_BASIC_HASH: ${CP_BASIC_HASH:?set CP_BASIC_HASH in platform/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tenants-caddy:/etc/caddy/tenants
      # Per-tenant access logs. A bind mount, not a named volume, so the control
      # plane can read them straight off the host (it already mounts STACK_ROOT)
      # without needing to exec into this container.
      - ./caddy-logs:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config
    networks: [semivra-net]

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Replica set is mandatory: the app's money paths use multi-document
    # transactions, which MongoDB only allows on a replica set.
    # Starts mongod as before unless MONGO_AUTH=on, which adds --auth and the
    # replica-set keyfile. See mongo-entrypoint.sh and MONGO_AUTH.md.
    entrypoint: ["/bin/bash", "/mongo-entrypoint.sh"]
    environment:
      MONGO_AUTH: ${MONGO_AUTH:-off}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_KEYFILE_CONTENT: ${MONGO_KEYFILE_CONTENT:-}
      # First boot of an EMPTY data dir only: the image creates this root user.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
      - ./mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
      - ./mongo-health.sh:/mongo-health.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/mongo-health.sh"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 12
    networks: [semivra-net]

  # Scheduled, self-verifying backups of every tenant database. Each run is
  # read back with a dry-run restore before it is kept; see backup-loop.sh.
  # Prove a full restore periodically with: bash platform/restore-drill.sh
  backup:
    image: mongo:7
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup-loop.sh"]
    environment:
      # With MONGO_AUTH=on set MONGO_BACKUP_URI to the root login, e.g.
      # mongodb://root:<password>@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_BACKUP_URI: ${MONGO_BACKUP_URI:-mongodb://mongo:27017/?replicaSet=rs0}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: Asia/Manila
    volumes:
      - ./backups:/backups
      - ./backup-loop.sh:/backup-loop.sh:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [semivra-net]

  # Offsite copy to Cloudflare R2 or Backblaze B2 (both speak S3). A backup
  # that lives on the same VPS as the data dies with it. Enable with
  #   docker compose --profile offsite up -d
  # after setting the OFFSITE_* variables in platform/.env.
  backup-offsite:
    image: rclone/rclone:1.68
    profiles: ["offsite"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          rclone copy /backups offsite:$${OFFSITE_BUCKET}/semivra-backups
            --include 'semivra-*.archive.gz' --include 'LAST_*' --s3-no-check-bucket
          && date -u +%FT%TZ > /backups/LAST_OFFSITE_SYNC
          || echo "offsite sync failed";
          sleep 21600;
        done
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
    volumes:
      - ./backups:/backups
    networks: [semivra-net]

  control-plane:
    build: ./control-plane
    restart: unless-stopped
    # 127.0.0.1 ONLY. Changing this to 0.0.0.0 puts a root-equivalent panel on
    # the public internet. Use: ssh -L 9000:localhost:9000 root@<vps>
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      PORT: 9000
      MONGO_AUTH: ${MONGO_AUTH:-off}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # STACK_ROOT is the path where the control-plane reads/writes tenant files
      # and where docker compose finds build contexts. On the VPS this is the
      # same path inside and outside. On Windows Docker Desktop, we mount the
      # repo root at /opt/semivra so there are no host-path or spaces issues;
      # docker compose build sends context as a tarball, so the daemon never
      # needs the host path directly.
      STACK_ROOT: /opt/semivra
      CP_PASSWORD: ${CP_PASSWORD}
      CP_DANGER_PASSWORD: ${CP_DANGER_PASSWORD}
      LOCAL_MODE: ${LOCAL_MODE:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the repo root (parent of platform/) at /opt/semivra inside the
      # container. Docker Desktop translates the Windows path automatically.
      - ..:/opt/semivra
    depends_on:
      mongo:
        condition: service_healthy
    networks: [semivra-net]

volumes:
  mongo-data:
  caddy-data:
  caddy-config:

networks:
  semivra-net:
    name: semivra-net
    external: true
