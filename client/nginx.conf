server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers (2026-11 audit, M33). The CSP is the backstop for any
  # markup that slips past escaping: no inline or third-party script runs.
  # 'unsafe-inline' styles are needed by the printed receipts, which carry
  # their own <style>. Images allow data: (product photos are data URLs) and
  # https: (logos). They reach the app pages (location / and the proxied API);
  # the static asset locations below set their own caching headers instead,
  # which is fine - a script or stylesheet response is not a document.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws://$host wss://$host; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob: about:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker must always revalidate so PWA updates propagate to devices.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # API + websockets are proxied over the internal Docker network, so the api
  # container publishes no ports and the browser only ever talks to this origin.
  # Same-origin means CORS never applies — VITE_API_URL is left empty so the
  # client builds relative paths.
  #
  # __API_HOST__ is substituted at image build time (see client/Dockerfile).
  # Single-tenant deploys default it to "api". The multi-tenant control plane
  # sets it to "<slug>-api", because on a SHARED docker network Compose adds the
  # service name as an alias for every project — so a literal "api" could
  # resolve to another tenant's backend. Never hardcode "api" here again.
  location /api/ {
    proxy_pass http://__API_HOST__:5002;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Product images are base64 data URLs in JSON bodies; the 1m default is tight.
    client_max_body_size 25m;
    proxy_read_timeout   120s;
  }

  # Socket.io needs the HTTP/1.1 upgrade dance or it falls back to polling.
  location /socket.io/ {
    proxy_pass http://__API_HOST__:5002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
  }

  # Uptime monitors hit this; keeps the API's own /health reachable without
  # exposing the container.
  location = /health {
    proxy_pass http://__API_HOST__:5002/health;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
