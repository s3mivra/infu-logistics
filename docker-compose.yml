# Single-box deployment: nginx + API + MongoDB, all on one VPS.
#
# Only `web` publishes a port. The API and the database are reachable solely
# over the internal Docker network — an internet-reachable MongoDB gets found
# and ransomwared, so never add a `ports:` entry to the mongo service.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # A REPLICA SET, not a standalone: every money/stock path (spoilage, void,
    # refund, order completion, PO receiving) runs in a multi-document
    # transaction, and MongoDB only permits those on a replica set.
    # --wiredTigerCacheSizeGB caps RAM so Mongo can't crowd out Node on an 8 GB box.
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "2"]
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
    healthcheck:
      # Initiates the replica set on first boot, then just reports status.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 12

  api:
    build: ./server
    restart: unless-stopped
    # No ports: nginx proxies /api and /socket.io over the internal network.
    environment:
      NODE_ENV: production
      PORT: 5002
      # MUST match VITE_BUSINESS_TYPE below — a mismatch trips the app's own
      # red configuration banner. Omitting it silently defaults the server to "fb".
      BUSINESS_TYPE: ${VITE_BUSINESS_TYPE}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_PASS: ${ADMIN_PASS:-ChangeMe@2026!}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./client
      # VITE_* are inlined at build time — see client/Dockerfile.
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BUSINESS_TYPE: ${VITE_BUSINESS_TYPE}
        VITE_BUSINESS_NAME: ${VITE_BUSINESS_NAME}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
        VITE_THEME: ${VITE_THEME}
        VITE_FB_LINK: ${VITE_FB_LINK}
        VITE_BILLING_NAME: ${VITE_BILLING_NAME}
        VITE_BILLING_ADDRESS1: ${VITE_BILLING_ADDRESS1}
        VITE_BILLING_ADDRESS2: ${VITE_BILLING_ADDRESS2}
        VITE_BILLING_PHONE: ${VITE_BILLING_PHONE}
        VITE_BILLING_EMAIL: ${VITE_BILLING_EMAIL}
        VITE_BILLING_BANK: ${VITE_BILLING_BANK}
        VITE_BILLING_ACCOUNT_NAME: ${VITE_BILLING_ACCOUNT_NAME}
        VITE_BILLING_ACCOUNT_NO: ${VITE_BILLING_ACCOUNT_NO}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
